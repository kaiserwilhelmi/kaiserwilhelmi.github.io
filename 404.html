/* The smallest page on the site theme: start a new page from this one. Colors, fonts, the header, the skip link and

* { box-sizing: border-box; min-width: 0; }
body { margin: 0; background: var(--ink, #080c15); color: var(--paper, #eef2f8); font: 16px/1.6 var(--f-body, "IBM Plex Sans", -apple-system, "Segoe UI", Arial, sans-serif); overflow-x: clip; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 max(16px, 4vw); }
h1, h2 { font-family: var(--f-head, "Space Grotesk", "IBM Plex Sans", -apple-system, "Segoe UI", Arial, sans-serif); font-weight: 600; letter-spacing: -0.015em; margin: 0; }
.dw-site { margin-bottom: 0; }
footer { margin-top: 40px; padding: 24px 0 48px; border-top: 1px solid var(--rule, #25324a); color: var(--faint, #7d89a1); font-size: 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.missing { padding: 64px 0 48px; max-width: 40em; }
.missing h1 { font-size: clamp(30px, 4.4vw, 44px); line-height: 1.12; margin-bottom: 14px; }
.missing p { color: var(--pencil, #aab5c7); font-size: 18px; margin: 0; }
</style>
