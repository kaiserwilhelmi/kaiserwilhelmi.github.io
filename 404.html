<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Dawson Wilhelmi</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root { color-scheme: dark;
  --ink: #080c15; --rule: #25324a;
  --paper: #eef2f8; --pencil: #aab5c7; --faint: #7d89a1; --steel: #7cc7f2;
  --f-head: "Space Grotesk", "IBM Plex Sans", -apple-system, "Segoe UI", Arial, sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
* { box-sizing: border-box; min-width: 0; }
body { margin: 0; background: radial-gradient(900px 520px at 85% -60px, rgba(56, 104, 190, .2), transparent 70%) no-repeat, var(--ink); color: var(--paper); font: 16px/1.6 var(--f-body); overflow-x: clip; }
a { color: var(--steel); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:focus-visible { outline: 2px solid var(--steel); outline-offset: 3px; border-radius: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 max(16px, 4vw); }
h1, h2 { font-family: var(--f-head); font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
.site { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 22px 0 18px; border-bottom: 1px solid var(--rule); }
.site .me { font-family: var(--f-head); font-weight: 600; font-size: 19px; color: var(--paper); text-decoration: none; }
.site nav { display: flex; gap: 22px; font-size: 15px; }
.site nav a { color: var(--pencil); text-decoration: none; padding: 6px 0; }
.site nav a:hover { color: var(--paper); }
.site nav a.on { color: var(--paper); box-shadow: inset 0 -2px 0 var(--steel); }
footer { margin-top: 40px; padding: 24px 0 48px; border-top: 1px solid var(--rule); color: var(--faint); font-size: 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
/* skip link: hidden until it gets keyboard focus */
.dw-skip { position: absolute; left: 12px; top: -80px; z-index: 1000; padding: 10px 16px; border-radius: 4px; background: #eef2f8; color: #080c15; font: 600 15px/1.2 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-decoration: none; }
.dw-skip:focus { top: 12px; outline: 2px solid #7cc7f2; outline-offset: 2px; }
main:focus { outline: none; }
.missing { padding: 64px 0 48px; max-width: 40em; }
.missing h1 { font-size: clamp(30px, 4.4vw, 44px); line-height: 1.12; margin-bottom: 14px; }
.missing p { color: var(--pencil); font-size: 18px; margin: 0; }
</style>
</head>
<body>
<a class="dw-skip" href="#main">Skip to content</a>
<div class="wrap">
  <header class="site">
    <a class="me" href="/">Dawson Wilhelmi</a>
    <nav aria-label="Site"><a href="/">Projects</a><a href="/about/">About</a></nav>
  </header>

  <main id="main" tabindex="-1" class="missing">
    <h1>Page not found</h1>
    <p>There is no page at this address. The tools are listed on the <a href="/">Projects</a> page.</p>
  </main>

  <footer>
    <span>© 2026 Dawson Wilhelmi</span>
    <span>Hosted on GitHub Pages</span>
  </footer>
</div>
</body>
</html>
