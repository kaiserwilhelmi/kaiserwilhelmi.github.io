name: Forecast Compare checks
on:
  pull_request:
    paths: ["forecast-compare/**", ".github/workflows/forecast-compare-tests.yml"]
  push:
    branches: [main]
    paths: ["forecast-compare/**"]
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: forecast-compare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3 scipy==1.14.1 statsmodels==0.14.4 pandas==2.2.3
      - name: Engine checks
        run: node test/test_engine.js
      - name: JavaScript vs independent Python re-implementation
        run: node dump_js.js && python3 verify.py
      - name: Fits vs statsmodels
        run: python3 test/test_statsmodels.py
